[package]
name = "terranova"
version = "0.1.0"
edition = "2024"

[dependencies]
kdlite = "0.1.1"
knus = "3.4.0"
serde = "1.0.229"
serde-kdl2 = "0.1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
miette = { version="7.2.0", features=["fancy"] }
cxx = "1.0"
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
futures = "0.3.33"


[build-dependencies]
cxx-build = "1.0"
